name: test-and-lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify DEV_BUILD is nil
        run: |
          if ! grep -qE '^local DEV_BUILD = nil[[:space:]]' Core.lua; then
            echo "ERROR: DEV_BUILD must be nil before merging to main"
            grep -n 'DEV_BUILD' Core.lua
            exit 1
          fi

      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.1"

      - name: Set up LuaRocks
        uses: leafo/gh-actions-luarocks@v4

      - name: Install busted and luacheck
        run: |
          luarocks install busted
          luarocks install luacheck

      - name: Run tests
        run: busted --verbose

      - name: Run luacheck
        run: luacheck .
